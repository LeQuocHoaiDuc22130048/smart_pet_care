# ============================================================
# PetCareSmart — account-only local runtime
# Runs account_service as the replacement for identity_service
# and user_service.
#
# Start:
#   docker compose -f docker-compose.account.yml up -d --build
#
# Stop:
#   docker compose -f docker-compose.account.yml down
# ============================================================

networks:
  petcare-net:
    driver: bridge

volumes:
  mysql-data:
  rabbitmq-data:

services:
  mysql:
    image: mysql:8.0
    container_name: petcare-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - petcare-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: petcare-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - petcare-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  account-service:
    build:
      context: ./account_service
      dockerfile: Dockerfile
    container_name: petcare-account
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m -XX:MaxMetaspaceSize=160m"
      EUREKA_CLIENT_ENABLED: "false"
      ACCOUNT_DB_URL: jdbc:mysql://mysql:3306/pet_care_account?createDatabaseIfNotExist=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      USER_SERVICE_URL: http://account-service:8080/pet_care_user
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    ports:
      - "8080:8080"
      - "8082:8080"
    networks:
      petcare-net:
        aliases:
          - identity-service
          - user-service

  api-gateway:
    build:
      context: ./api_gateway
      dockerfile: Dockerfile
    container_name: petcare-gateway
    restart: unless-stopped
    depends_on:
      - account-service
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:MaxMetaspaceSize=128m"
      EUREKA_CLIENT_ENABLED: "false"
      GATEWAY_PORT: 8888
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY}
      IDENTITY_SERVICE_URL: http://account-service:8080
      USER_SERVICE_URL: http://account-service:8080
      PRODUCT_SERVICE_URL: http://product-service:8081
      ORDER_SERVICE_URL: http://order-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
      CART_SERVICE_URL: http://cart-service:8085
      BOOKING_SERVICE_URL: http://booking-service:8086
      FEEDBACK_SERVICE_URL: http://feedback-service:8088
      CHAT_SERVICE_URL: http://chat-service:8089
      NOTIFICATION_SERVICE_URL: http://notification-service:8091
      CMS_MARKETING_SERVICE_URL: http://cms-marketing-service:8092
      IMAGE_AI_SERVICE_URL: http://image-ai-service:8090
    ports:
      - "8888:8888"
    networks:
      - petcare-net
