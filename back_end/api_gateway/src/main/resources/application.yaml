server:
  port: ${GATEWAY_PORT:8888}

app:
  api-prefix: /api/v1
  security:
    jwt-signer-key: ${JWT_SIGNER_KEY}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}

spring:
  application:
    name: api-gateway
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:5173"
              - "http://localhost:3000"
              - "http://localhost:3001"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - Accept
              - Origin
              - X-Requested-With
              - Access-Control-Request-Method
              - Access-Control-Request-Headers
            exposedHeaders:
              - Authorization
            allowCredentials: true
            maxAge: 3600
      default-filters:
        # Xóa CORS headers trùng lặp từ downstream services
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      routes:
        # Identity Service
        - id: identity_service
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=${app.api-prefix}/pet_care_identity/**
          filters:
            - StripPrefix=2

        # User Service
        - id: user_service
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=${app.api-prefix}/pet_care_user/**
          filters:
            - StripPrefix=2

        # Product Service
        - id: product_service
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=${app.api-prefix}/pet_care_product/**
          filters:
            - StripPrefix=2

        # Order Service
        - id: order_service
          uri: ${ORDER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=${app.api-prefix}/pet_care_order/**
          filters:
            - StripPrefix=2

        # Payment Service
        - id: payment_service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=${app.api-prefix}/pet_care_payment/**
          filters:
            - StripPrefix=2

        # Cart Service
        - id: cart_service
          uri: ${CART_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=${app.api-prefix}/pet_care_cart/**
          filters:
            - StripPrefix=2

        # Booking Service
        - id: booking_service
          uri: ${BOOKING_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=${app.api-prefix}/pet_care_booking/**
          filters:
            - StripPrefix=2

        # Feedback Service
        - id: feedback_service
          uri: ${FEEDBACK_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=${app.api-prefix}/pet_care_feedback/**
          filters:
            - StripPrefix=2

        # Chat Service
        - id: chat_service
          uri: ${CHAT_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=${app.api-prefix}/pet_care_chat/**
          filters:
            - StripPrefix=2

        # Image AI Service
        - id: image_ai_service
          uri: ${IMAGE_AI_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=${app.api-prefix}/pet_care_image_ai/**
          filters:
            - RewritePath=${app.api-prefix}/pet_care_image_ai/(?<segment>.*), /image-ai/$\{segment}

identity:
  service:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8080}
    introspect-path: /pet_care_identity/auth/introspect

logging:
  level:
    com.pet_care.api_gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: TRACE
  pattern:
    console: "%d{HH:mm:ss} [%highlight(%-5level)] [api_gateway] %cyan(%logger{36}) - %msg%n"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
