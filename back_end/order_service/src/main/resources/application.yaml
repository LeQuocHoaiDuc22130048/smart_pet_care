server:
  port: 8083
  servlet:
    context-path: /pet_care_order

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.web.multipart: DEBUG
    org.springframework.web.servlet.DispatcherServlet: DEBUG

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: full

spring:
  application:
    name: order_service
  datasource:
    url: "jdbc:mysql://localhost:3306/pet_care_order?createDatabaseIfNotExist=true"
    driver-class-name: "com.mysql.cj.jdbc.Driver"
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    template:
      exchange: order.exchange
      routing-key: order.created
      default-receive-queue: order.created.queue
  security:
    oauth2:
      resource server:
        jwt:
          issuer-uri: "http://localhost:8080/pet_care_identity"
