server:
  port: 8086
  servlet:
    context-path: /pet_care_booking

spring:
  application:
    name: booking_service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pet_care_booking?createDatabaseIfNotExist=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

jwt:
  signerKey: ${JWT_SIGNER_KEY}

services:
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8082/pet_care_user}

logging:
  level:
    com.pet_care.booking: DEBUG
    org.springframework.security: WARN
    org.springframework.web: WARN
  pattern:
    console: "%d{HH:mm:ss} [%highlight(%-5level)] [booking_service] %cyan(%logger{36}) - %msg%n"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
