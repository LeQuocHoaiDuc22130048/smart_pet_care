server:
  port: 8080
  servlet:
    context-path: /pet_care_identity

spring:
  application:
    name: identity_service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pet_care_identity?createDatabaseIfNotExist=true}
    driver-class-name: "com.mysql.cj.jdbc.Driver"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  signerKey: ${JWT_SIGNER_KEY}
  valid-duration: ${JWT_VALID_DURATION:3600}       # in seconds
  refreshable-duration: ${JWT_REFRESHABLE_DURATION:36000} # in seconds

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

services:
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8082/pet_care_user}

logging:
  level:
    com.pet_care.identity: DEBUG
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.apache.catalina: WARN
    org.apache.tomcat: WARN
  pattern:
    console: "%d{HH:mm:ss} [%highlight(%-5level)] [identity_service] %cyan(%logger{36}) - %msg%n"