# ============================================================
# PetCareSmart — Docker Compose
# Chạy: docker-compose up -d
# Dừng: docker-compose down
# Xem log: docker-compose logs -f <service_name>
# ============================================================

networks:
  petcare-net:
    driver: bridge

volumes:
  mysql-data:
  rabbitmq-data:
  mongodb-data:
  image-ai-data:

x-eureka-client-env: &eureka-client-env
  EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/

services:

  # ─────────────────────────────────────────────
  # INFRASTRUCTURE
  # ─────────────────────────────────────────────

  mysql:
    image: mysql:8.0
    container_name: petcare-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - petcare-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: petcare-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI: http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - petcare-net
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7.0
    container_name: petcare-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: pet_care_feedback
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - petcare-net
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 10

  eureka-server:
    build:
      context: ./eureka_server
      dockerfile: Dockerfile
    container_name: petcare-eureka
    restart: unless-stopped
    environment:
      EUREKA_SERVER_PORT: 8761
      EUREKA_INSTANCE_HOSTNAME: eureka-server
    ports:
      - "8761:8761"
    networks:
      - petcare-net

  # ─────────────────────────────────────────────
  # BUSINESS SERVICES
  # ─────────────────────────────────────────────

  identity-service:
    build:
      context: ./identity_service
      dockerfile: Dockerfile
    container_name: petcare-identity
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_started
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *eureka-client-env
      DB_URL: jdbc:mysql://mysql:3306/pet_care_identity?createDatabaseIfNotExist=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      USER_SERVICE_URL: http://user-service:8082/pet_care_user
    ports:
      - "8080:8080"
    networks:
      - petcare-net

  user-service:
    build:
      context: ./user_service
      dockerfile: Dockerfile
    container_name: petcare-user
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_started
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *eureka-client-env
      DB_URL: jdbc:mysql://mysql:3306/pet_care_user?createDatabaseIfNotExist=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    ports:
      - "8082:8082"
    networks:
      - petcare-net

  product-service:
    build:
      context: ./product_service
      dockerfile: Dockerfile
    container_name: petcare-product
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_started
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *eureka-client-env
      DB_URL: jdbc:mysql://mysql:3306/pet_care_product?createDatabaseIfNotExist=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    ports:
      - "8081:8081"
    networks:
      - petcare-net

  order-service:
    build:
      context: ./order_service
      dockerfile: Dockerfile
    container_name: petcare-order
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_started
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      product-service:
        condition: service_started
    environment:
      <<: *eureka-client-env
      DB_URL: jdbc:mysql://mysql:3306/pet_care_order?createDatabaseIfNotExist=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      PRODUCT_SERVICE_URL: http://product-service:8081/pet_care_product
    ports:
      - "8083:8083"
    networks:
      - petcare-net

  payment-service:
    build:
      context: ./payment_service
      dockerfile: Dockerfile
    container_name: petcare-payment
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_started
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *eureka-client-env
      DB_URL: jdbc:mysql://mysql:3306/pet_care_payment?createDatabaseIfNotExist=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE}
      VNPAY_SECRET_KEY: ${VNPAY_SECRET_KEY}
      ORDER_SERVICE_URL: http://order-service:8083/pet_care_order
    ports:
      - "8084:8084"
    networks:
      - petcare-net

  cart-service:
    build:
      context: ./cart_service/cart
      dockerfile: Dockerfile
    container_name: petcare-cart
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_started
      mysql:
        condition: service_healthy
      product-service:
        condition: service_started
    environment:
      <<: *eureka-client-env
      DB_URL: jdbc:mysql://mysql:3306/pet_care_cart?createDatabaseIfNotExist=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY}
      PRODUCT_SERVICE_URL: http://product-service:8081/pet_care_product
    ports:
      - "8085:8085"
    networks:
      - petcare-net

  booking-service:
    build:
      context: ./booking_service
      dockerfile: Dockerfile
    container_name: petcare-booking
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_started
      mysql:
        condition: service_healthy
      user-service:
        condition: service_started
    environment:
      <<: *eureka-client-env
      DB_URL: jdbc:mysql://mysql:3306/pet_care_booking?createDatabaseIfNotExist=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY}
      USER_SERVICE_URL: http://user-service:8082/pet_care_user
      SERVER_SERVLET_CONTEXT_PATH: /pet_care_booking
    ports:
      - "8086:8086"
    networks:
      - petcare-net

  feedback-service:
    build:
      context: ./feedback_service
      dockerfile: Dockerfile
    container_name: petcare-feedback
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_started
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *eureka-client-env
      MONGODB_URI: mongodb://mongodb:27017/pet_care_feedback
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      ORDER_SERVICE_URL: http://order-service:8083/pet_care_order
      PRODUCT_SERVICE_URL: http://product-service:8081/pet_care_product
    ports:
      - "8088:8088"
    networks:
      - petcare-net

  chat-service:
    build:
      context: ./chat_service
      dockerfile: Dockerfile
    container_name: petcare-chat
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_started
      image-ai-service:
        condition: service_healthy
    environment:
      <<: *eureka-client-env
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      PRODUCT_SERVICE_URL: http://product-service:8081/pet_care_product
      BOOKING_SERVICE_URL: http://booking-service:8086/pet_care_booking
      IMAGE_AI_SERVICE_URL: http://image-ai-service:8090
    ports:
      - "8089:8089"
    networks:
      - petcare-net

  image-ai-service:
    build:
      context: ./image_ai_service
      dockerfile: Dockerfile
    container_name: petcare-image-ai
    restart: unless-stopped
    depends_on:
      product-service:
        condition: service_started
    environment:
      PRODUCT_SERVICE_URL: http://product-service:8081/pet_care_product
      IMAGE_AI_DATA_DIR: /app/data
      CLIP_MODEL_NAME: ${CLIP_MODEL_NAME:-ViT-B-32}
      CLIP_PRETRAINED: ${CLIP_PRETRAINED:-laion2b_s34b_b79k}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.2}
      IMAGE_ANALYSIS_INCLUDE_BUILT_INS: ${IMAGE_ANALYSIS_INCLUDE_BUILT_INS:-false}
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8090:8090"
    volumes:
      - image-ai-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - petcare-net

  # ─────────────────────────────────────────────
  # API GATEWAY
  # ─────────────────────────────────────────────

  api-gateway:
    build:
      context: ./api_gateway
      dockerfile: Dockerfile
    container_name: petcare-gateway
    restart: unless-stopped
    depends_on:
      - eureka-server
      - identity-service
      - user-service
      - product-service
      - order-service
      - payment-service
      - cart-service
      - booking-service
      - feedback-service
      - chat-service
      - image-ai-service
    environment:
      <<: *eureka-client-env
      GATEWAY_PORT: 8888
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY}
      IDENTITY_SERVICE_URL: http://identity-service:8080
      USER_SERVICE_URL: http://user-service:8082
      PRODUCT_SERVICE_URL: http://product-service:8081
      ORDER_SERVICE_URL: http://order-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
      CART_SERVICE_URL: http://cart-service:8085
      BOOKING_SERVICE_URL: http://booking-service:8086
      FEEDBACK_SERVICE_URL: http://feedback-service:8088
      CHAT_SERVICE_URL: http://chat-service:8089
      IMAGE_AI_SERVICE_URL: http://image-ai-service:8090
    ports:
      - "8888:8888"
    networks:
      - petcare-net
